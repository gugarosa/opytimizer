name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-publish:
    name: Build and publish distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Verify release tag
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - name: Install locked environment
        run: uv sync --locked
      - name: Test release revision
        run: uv run pytest
      - name: Build wheel and source distribution
        run: uv build --sdist --wheel
      - name: Smoke-test built distributions
        shell: bash
        run: |
          version="$(uv version --short)"
          uv venv .release-wheel --python 3.11
          uv pip install --python .release-wheel/bin/python dist/*.whl
          .release-wheel/bin/python -I -c "import opytimizer; from opytimizer import Opytimizer; from opytimizer.spaces import SearchSpace; from opytimizer.optimizers.swarm import PSO; assert opytimizer.__version__ == '$version'"
          uv venv .release-sdist --python 3.11
          uv pip install --python .release-sdist/bin/python dist/*.tar.gz
          .release-sdist/bin/python -I -c "import opytimizer; from opytimizer import Opytimizer; from opytimizer.spaces import SearchSpace; from opytimizer.optimizers.swarm import PSO; assert opytimizer.__version__ == '$version'"
      - name: Publish distributions
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
